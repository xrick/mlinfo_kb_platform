# Docker Compose for Development Environment
# Provides Redis for caching infrastructure
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up -d
#   docker-compose -f docker-compose.dev.yml down
#
# Author: Claude (SuperClaude)
# Date: 2025-10-01

version: '3.8'

services:
  # Redis for Phase 2 caching
  redis:
    image: redis:7-alpine
    container_name: mlinfo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - mlinfo_network

  # Redis Commander (Optional - for debugging)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mlinfo_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - mlinfo_network
    profiles:
      - debug

volumes:
  redis_data:
    driver: local

networks:
  mlinfo_network:
    driver: bridge
